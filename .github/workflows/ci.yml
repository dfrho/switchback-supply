name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog
        run: npm run validate:catalog

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Dry run the LaunchDarkly setup script
        run: npm run ld:setup -- --dry-run

      - name: Dry run the synthetic traffic script
        run: npm run assistant:traffic -- --dry-run

      - name: Guard against committed secrets
        # Fails if anything that looks like a LaunchDarkly server SDK key, API token,
        # or trigger URL, or an Anthropic API key, is committed. Client-side IDs are
        # public by design and allowed.
        run: |
          if git grep -nE "sdk-[0-9a-f]{8}-[0-9a-f]{4}-|api-[0-9a-f]{8}-[0-9a-f]{4}-|app\.launchdarkly\.com/webhook/trig|sk-ant-[A-Za-z0-9_-]{20,}" -- . ':!.github/workflows/ci.yml'; then
            echo "Possible secret committed. Remove it and rotate the key in LaunchDarkly."
            exit 1
          fi

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests against dev and production builds
        # Starts a mock LaunchDarkly server, the Vite dev server, and a production build (see playwright.config.ts).
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
